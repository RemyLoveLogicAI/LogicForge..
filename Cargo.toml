[package]
name = "genesis-engine"
version = "0.1.0"
edition = "2021"
authors = ["Genesis Team <team@genesis-engine.dev>"]
description = "Autonomous AI Empire Orchestrator - Build, Deploy, and Monetize AI Products"
license = "MIT"
readme = "README.md"
repository = "https://github.com/genesis-engine/genesis-engine"
keywords = ["ai", "automation", "cli", "saas", "deployment"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "genesis"
path = "src/main.rs"

[lib]
name = "genesis_engine"
path = "src/lib.rs"

[dependencies]
# CLI Framework
clap = { version = "4", features = ["derive", "env", "color"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Git Operations
git2 = "0.19"

# Error Handling
anyhow = "1"
thiserror = "1"

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# UUID Generation
uuid = { version = "1", features = ["v4", "serde"] }

# Environment Variables
dotenvy = "0.15"

# Terminal UI
colored = "2"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# URL handling
url = "2"

# Regular expressions
regex = "1"

# Base64 encoding
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
tokio-test = "0.4"
wiremock = "0.6"

[[test]]
name = "database_tests"
path = "tests/integration/database_tests.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
