# Genesis Engine Example Configuration
# Copy this file to default.toml and customize

[empire]
# Name for your AI business empire
name = "my-empire"

# Enable autonomous mode (auto-launch projects above threshold)
auto_mode = false

# Maximum number of concurrent projects
max_concurrent_projects = 5

# Budget per project in USD
budget_per_project_usd = 500.0

[scanning]
# Sources to scan for opportunities
# Options: github, reddit, producthunt, hackernews, twitter
enabled_sources = ["github", "reddit", "producthunt", "hackernews"]

# How often to scan (hours)
scan_interval_hours = 6

# Minimum score (0-100) for opportunities to be considered
min_opportunity_score = 75.0

[ai]
# Primary AI provider for code generation
# Options: genspark, openai
primary_provider = "genspark"

# Fallback provider if primary fails
fallback_provider = "openai"

# Maximum retry attempts for AI operations
max_retries = 3

[ai.genspark]
# GenSpark API key (or set GENSPARK_API_KEY env var)
api_key = "${GENSPARK_API_KEY}"

# GenSpark workspace ID (or set GENSPARK_WORKSPACE_ID env var)
workspace_id = "${GENSPARK_WORKSPACE_ID}"

# GenSpark API base URL
base_url = "https://api.genspark.ai/v1"

[ai.openai]
# OpenAI API key (or set OPENAI_API_KEY env var)
api_key = "${OPENAI_API_KEY}"

# OpenAI model to use
model = "gpt-4-turbo-preview"

[deployment]
# Default deployment platform
# Options: vercel, cloudflare, netlify, railway
default_platform = "vercel"

# Automatically deploy after code generation
auto_deploy = false

[deployment.vercel]
# Vercel API token (or set VERCEL_TOKEN env var)
api_token = "${VERCEL_TOKEN}"

# Vercel team ID (optional)
team_id = "${VERCEL_TEAM_ID}"

[deployment.cloudflare]
# Cloudflare API token (or set CLOUDFLARE_TOKEN env var)
api_token = "${CLOUDFLARE_TOKEN}"

# Cloudflare account ID (or set CLOUDFLARE_ACCOUNT_ID env var)
account_id = "${CLOUDFLARE_ACCOUNT_ID}"

[github]
# GitHub personal access token (or set GITHUB_TOKEN env var)
token = "${GITHUB_TOKEN}"

# GitHub organization (optional, uses personal account if not set)
org = "${GITHUB_ORG}"

# Automatically create repositories for new projects
auto_create_repos = true

[revenue]
# How often to track revenue metrics (hours)
track_interval_hours = 24

# Alert if revenue drops by this percentage
alert_threshold_drop_percent = 20.0

[database]
# SQLite database path
path = "./data/genesis.db"

# Enable automatic backups
auto_backup = true
