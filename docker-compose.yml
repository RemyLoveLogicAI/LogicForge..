version: '3.8'

services:
  genesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-engine
    restart: unless-stopped
    environment:
      # Required API Keys (set in .env file)
      - GENESIS_API_KEY=${GENESIS_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Deployment Platform Tokens (optional)
      - VERCEL_TOKEN=${VERCEL_TOKEN:-}
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      
      # Notification Webhooks (optional)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      
      # Logging
      - RUST_LOG=${RUST_LOG:-info}
      
      # Paths
      - GENESIS_CONFIG_DIR=/etc/genesis/config
      - GENESIS_DATA_DIR=/var/lib/genesis
      - GENESIS_TEMPLATE_DIR=/etc/genesis/templates
    volumes:
      # Persistent data storage
      - genesis-data:/var/lib/genesis
      # Optional: Mount custom config (read-only)
      - ./config:/etc/genesis/config:ro
      # Optional: Mount custom templates (read-only)
      - ./templates:/etc/genesis/templates:ro
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "genesis", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Optional: Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: genesis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - with-cache

  # Optional: Prometheus metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: genesis-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - genesis-network
    ports:
      - "9090:9090"
    profiles:
      - with-monitoring

  # Optional: Grafana dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: genesis-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-genesis123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - genesis-network
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles:
      - with-monitoring

volumes:
  genesis-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  genesis-network:
    driver: bridge
